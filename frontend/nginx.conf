# nginx.conf

# Define the server block that handles incoming HTTP requests.
server {
    # Listen on port 80 for incoming connections.
    listen 80;

    # Match any hostname requested by the client.
    server_name _;

    # Set the root directory where Nginx looks for files.
    root /usr/share/nginx/html;

    # Default file to serve if a directory is requested
    index index.html;

    # Enable gzip compression with optimized settings
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "MSIE [1-6]\.";

    # Add security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Handle requests for files and directories.
    location / {
        try_files $uri $uri/ /index.html;
        
        # Add cache control for HTML files
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Enhanced caching for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|webp|woff|woff2|ttf|eot)$ {
        # Cache for 1 year with versioning
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        
        # Add CORS headers
        add_header Access-Control-Allow-Origin "*";
        
        # Enable sendfile for better performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # Enable keepalive
        keepalive_timeout 65;
        keepalive_requests 100;
    }

    # Cache API responses
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Add cache control for API responses
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=30";
        expires 1m;
    }

    # Cache media files
    location ~* \.(?:mp4|webm|ogg|mp3|wav)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
    }

    # Cache fonts
    location ~* \.(?:woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Cache images
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Cache CSS and JavaScript
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Enable browser caching for static files
    location ~* \.(?:ico|css|js|gif|jpeg|jpg|png|woff|ttf|otf|svg|woff2|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        log_not_found off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}