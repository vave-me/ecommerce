message SearchOrdersRequest {
  string user_customer_id = 1;
  google.protobuf.Timestamp after = 2;
  google.protobuf.Timestamp before = 3;
  repeated string user_seller_ids = 4;
  repeated string product_ids = 5;
  int64 min_total = 6;
  int64 max_total = 7;
  string status = 8;
  string next = 9; // e.g. for pagination token
  int64 limit = 10;
}

message SearchOrdersResponse {
  repeated Order orders = 1;
  string next = 2; // pagination token if needed
}

message GetOrderRequest {
