//Common search parameters and metadata for optimizing the search architecture
message SearchContext {
  string request_id = 1; // Unique ID for the request (for tracking and caching)
  string client_id = 2; // ID of the client making the request
  int64 timestamp_ms = 3; // Request timestamp
  bool bypass_cache = 4; // Whether to bypass cache for this request
  map<string, string> metadata = 5; // Additional metadata
  SearchPerformanceSettings performance_settings = 6; // Performance tweaks
}

message SearchPerformanceSettings {
  int32 timeout_ms = 1; // Timeout for this search
  int32 max_concurrent_queries = 2; // Maximum number of concurrent queries
  bool enable_early_termination = 3; // Whether to return partial results if some entity searches time out
  bool optimize_for_speed = 4; // Prioritize speed over completeness
  int32 query_cache_ttl_seconds = 5; // How long to cache this query's results
  bool use_query_expansion = 6; // Whether to expand the query for better recall
  int32 max_retries = 7; // Maximum number of retries for fallback operations
}

message CommonFilters {
  repeated string statuses = 1; // Status filters applicable to any entity
  repeated string entity_types = 2; // Entity types to include
  int64 created_after_timestamp = 3; // Filter by creation date (Unix timestamp)
  int64 created_before_timestamp = 4; // Filter by creation date (Unix timestamp)
  repeated string user_ids = 5; // Filter by user IDs
  repeated string category_ids = 6; // Filter by category IDs
  repeated string tags = 7; // Filter by tags
  float min_price = 8; // Minimum price
  float max_price = 9; // Maximum price
  GeoFilter geo_filter = 10; // Geolocation filter
}

message GeoFilter {
  float lat = 1;
  float lng = 2;
  float radius_km = 3;
  string country_code = 4;
  string region = 5;
  string city = 6;
  string postal_code = 7;
}

//Feed-specific options
message FeedOptions {
  string algorithm = 1; // Algorithm to use for ranking feed items: "recency", "popularity", "relevance", "hybrid"
  bool personalized = 2; // Whether to personalize the feed for the user
  int32 freshness_hours = 3; // Only include items created within this many hours
  bool deduplicate = 4; // Whether to deduplicate items (useful when showing feeds from multiple sources)
  bool include_pinned = 5; // Whether to include pinned items at the top
  int32 pinned_items_count = 6; // Maximum number of pinned items to include
  string experiment_id = 7; // For A/B testing different feed implementations
  int32 min_score = 8; // Minimum relevance/quality score for items to include
  bool use_extended_fallback = 9; // Whether to use extended fallback strategy for feed generation
}

// Cache control and performance metrics

// Adding ItemMetric message
message ItemMetric {
  string id = 1;
  string entity_type = 2;
  int64 likes_count = 3;
  int64 dislikes_count = 4;
  int64 comments_count = 5;
  int64 shared_count = 6;
  int64 added_to_wishlist_count = 7;
  int64 added_to_basket_count = 8;
  int64 visited_count = 9;
  int64 reported_count = 10;
  int64 follower_count = 11;
  int64 reviews_count = 12;
  int64 rating_count = 13;
  int64 videos_count = 14;
  int64 images_count = 15;
  int64 rating = 16;
  string category = 17;
  string category_id = 18;
  string category_slug = 19;
}