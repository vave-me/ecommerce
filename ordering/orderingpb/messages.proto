syntax = "proto3";

package orderingpb;

message OrderCreated {
  message Item {
    string product_id = 1;
    string user_seller_id = 2;
    int64 price = 3;
    int64 quantity = 4;
  }

  string id = 1;
  string user_customer_id = 2;
  string shopping_id = 3;
  repeated Item items = 4;
  // Correlates the order back to the originating basket (optional but recommended)
  string basket_id = 5;
  // Stripe payment_intent identifier for correlation
  string payment_intent = 6;
}

message OrderRejected {
  string id = 1;
  string user_customer_id = 2;
  string payment_method_id = 3;
}

message OrderApproved {
  string id = 1;
  string user_customer_id = 2;
  string payment_method_id = 3;
  // Reservation / shopping service reference (optional)
  string shopping_id = 4;
}

message OrderReadied {
  string id = 1;
  string user_customer_id = 2;
  string payment_method_id = 3;
  int64 total = 4;
}

message OrderCompleted {
  string id = 1;
  string user_customer_id = 2;
  string invoice_id = 3;
}

message OrderCanceled {
  string id = 1;
  string user_customer_id = 2;
  string payment_method_id = 3;
}

message OrderShipped {
  string id = 1;
  string user_customer_id = 2;
}

message OrderDelivered {
  string id = 1;
  string user_customer_id = 2;
}

// Commands

message RejectOrder {
  string id = 1;
}

message ApproveOrder {
  string id = 1;
  string shopping_id = 2;
}
