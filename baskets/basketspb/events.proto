syntax = "proto3";

package basketspb;

message BasketStarted {
  string id = 1;
  // Removed user_customer_id; user ID is obtained from context if needed
}

message BasketCanceled {
  string id = 1;
}

message BasketItemAdded {
  string product_id = 2;
  int64 quantity = 3;
}

message BasketItemRemoved {
  string product_id = 2;
  int64 quantity = 3;
}

message BasketCheckedOut {
  message Item {
    string user_seller_id = 1;
    string product_id = 2;
    string user_seller_name = 3;
    string product_name = 4;
    int64 price = 5;
    int64 quantity = 6;
  }
  string id = 1;
  string user_customer_id = 2;
  int64  total = 3;
  repeated Item items = 4;
  string payment_intent_id = 5;
}
