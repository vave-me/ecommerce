version: "3.9"

# ------------------------------------------------------------
# Common anchors for microservices
# ------------------------------------------------------------
x-micro-build: &micro-build
  context: .
  dockerfile: docker/Dockerfile.microservices

x-micro-env: &micro-env
  ENVIRONMENT: ${ENVIRONMENT}
  NATS_URL: ${NATS_URL}
  JWT_ISSUER: "users_service"
  JWT_SECRET_KEY: REDACTED
  JWT_AUDIENCE: "www.example.com"
  COOKIE_DOMAIN: "localhost"
  DOMAIN: ${DOMAIN}
  API_KEY: REDACTED
  VERSION_TAG: ${VERSION_TAG}
  BUILD_NUMBER: ${BUILD_NUMBER}

services:
  ####################################################################
  # MICROSERVICES
  ####################################################################

  activity:
    container_name: activity
    hostname: activity
    image: ${ACTIVITY_IMAGE:-middleman-activity}
    build:
      <<: *micro-build
      args:
        service: activity
    ports:
      - "9005:9000"
    expose:
      - "9000"
    env_file:
      - ./docker/.env
    environment:
      <<: *micro-env
      PG_CONN: "host=postgres dbname=activity user=activity_user password=${ACTIVITY_PASS} search_path=activity,public"
      RPC_SERVICES: "USERS=users:9000"
      OTEL_SERVICE_NAME: activity
      OTEL_EXPORTER_OTLP_ENDPOINT: collector:4317
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://collector:4317
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    depends_on:
      - nats
      - postgres
    command: [ "./wait-for", "postgres:5432", "--", "/middleman/service" ]
    profiles:
      - microservices
      - activity
  assistants:
    container_name: assistants
    hostname: assistants
    image: ${ASSISTANTS_IMAGE:-middleman-assistants}
    build:
      <<: *micro-build
      args:
        service: assistants
    ports:
      - "9035:9000"
    expose:
      - "9000"
    env_file:
      - ./docker/.env
    environment:
      <<: *micro-env
      PG_CONN: "host=postgres dbname=assistants user=assistants_user password=${ASSISTANTS_PASS} search_path=assistants,public"
      ANTHROPIC_API_KEY: REDACTED
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      OPENAI_API_KEY: REDACTED
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_BASE_MODEL: ${OPENAI_BASE_MODEL}
      DEEPSEEK_API_KEY: REDACTED
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL}
      DEEPSEEK_DEFAULT_MODEL: ${DEEPSEEK_DEFAULT_MODEL}
      GOOGLE_AI_API_KEY: REDACTED
      GOOGLE_AI_BASE_URL: ${GOOGLE_AI_BASE_URL}
      GOOGLE_AI_DEFAULT_MODEL: ${GOOGLE_AI_DEFAULT_MODEL}
      RPC_SERVICES: "ACTIVITY=activity:9000, BASKETS=baskets:9000, CATEGORIES=categories:9000, COMMENTS=comments:9000, FOLLOWING=following:9000, GEOCODING=geocoding:9000, MAILER=mailer:9000, MANAGERS=managers:9000, MEDIA=media:9000, MERCHANT=merchant:9000, MESSAGES=messages:9000, METRICS=metrics:9000, NEWSLETTERS=newsletters:9000, NOTIFICATIONS=notifications:9000, OFFERS=offers:9000, ORDERING=ordering:9000, PAYMENTS=payments:9000, POSTS=posts:9000, PRODUCTS=products:9000, REVIEWS=reviews:9000, SCHEDULER=scheduler:9000, SEARCH=search:9000, SERVICES=services:9000, SHIPPING=shipping:9000,ERP=erp:9000, SUPPORT=support:9000, USERS=users:9000"
      OTEL_SERVICE_NAME: assistants
