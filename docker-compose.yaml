  reverse-proxy:
    container_name: proxy
    hostname: proxy
    image: ${REVERSE_PROXY_IMAGE:-nginx:alpine}
    ports:
      - "8080:8080"
    volumes:
      - "./docker/nginx.conf:/etc/nginx/nginx.conf:ro"
    env_file:
      - ./docker/.env
    profiles:
      - microservices

  ####################################################################
  # DATA STORES / INFRA
  ####################################################################
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--loadmodule", "/usr/lib/redis/modules/redisearch.so" ]
    env_file:
      - ./docker/.env
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: REDACTED
    volumes:
      - redis_data:/data
      - redisearch_module:/usr/lib/redis/modules
    restart: unless-stopped
    profiles:
      - microservices


  redisearch_setup:
    image: redislabs/redisearch:latest
    container_name: redisearch_setup
    command: [ "sleep", "infinity" ]
    volumes:
      - redisearch_module:/usr/lib/redis/modules
    profiles:
      - microservices


  postgres:
    container_name: postgres
    hostname: postgres
    image: postgis/postgis:16-3.5-alpine
    restart: always
    env_file:
      - ./docker/.env
    environment:
      POSTGRES_PASSWORD: REDACTED
    ports:
      - "5432:5432"
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./docker/database:/docker-entrypoint-initdb.d"
    profiles:
      - microservices


  nats:
    container_name: nats
    hostname: nats
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "9222:9222"
    command:
      - -js
      - -sd
      - /var/lib/nats/data
      - -c
      - /etc/nats/server.conf
    volumes:
      - "./docker/nats/:/etc/nats/"
      - "jsdata:/var/lib/nats/data"
    depends_on:
      - reverse-proxy
    profiles:
      - microservices


  nominatim:
    container_name: nominatim
    shm_size: 4g
    hostname: nominatim
    image: mediagis/nominatim:4.5
    ports:
      - "7070:8080"
      - "5435:5432"
    expose:
      - "7070"
    env_file:
      - ./docker/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      RPC_SERVICES: "USERS=users:9000"
      NATS_URL: ${NATS_URL}
      JWT_ISSUER: "users_service"
      JWT_SECRET_KEY: REDACTED
      JWT_AUDIENCE: "www.example.com"
      COOKIE_DOMAIN: "localhost"
      DOMAIN: ${DOMAIN}
      API_KEY: REDACTED
      GEOCODING_API_KEY: REDACTED
      GEOCODING_TOKEN_SECRET: REDACTED
      PBF_URL: ${PBF_URL}
      REPLICATION_URL: ${REPLICATION_URL}
      IMPORT_WIKIPEDIA: ${IMPORT_WIKIPEDIA}
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS}
      POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM}
      POSTGRES_AUTOVACUUM_WORK_MEM: ${POSTGRES_AUTOVACUUM_WORK_MEM}
      POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM}
      POSTGRES_SYNCHRONOUS_COMMIT: ${POSTGRES_SYNCHRONOUS_COMMIT}
      POSTGRES_MAX_WAL_SIZE: ${POSTGRES_MAX_WAL_SIZE}
      POSTGRES_CHECKPOINT_TIMEOUT: ${POSTGRES_CHECKPOINT_TIMEOUT}
      POSTGRES_CHECKPOINT_COMPLETION_TARGET: ${POSTGRES_CHECKPOINT_COMPLETION_TARGET}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE}
      NOMINATIM_PASSWORD: REDACTED
    volumes:
      - "./docker/nominatim/:/data:ro"
      - nominatim_data:/var/lib/postgresql/16/main
      - "./docker/postgres/postgres-custom.conf:/etc/postgresql/16/main/conf.d/postgres-custom.conf:ro"
    profiles:
      - microservices

  ####################################################################
  # OBSERVABILITY
  ####################################################################
  collector:
    container_name: collector
    hostname: collector
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: [ "--config=/etc/otel-config.yml" ]
    volumes:
      - "./docker/otel/otel-config.yml:/etc/otel-config.yml:ro"
    ports:
      - "1888:1888"   # pprof extension
      - "8888:8888"   # Prometheus metrics exposed by the collector
      - "8889:8889"   # Prometheus exporter metrics
      - "13133:13133" # health_check extension
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP http receiver
      - "9464:9464"   # Prometheus exporter
    depends_on:
      - jaeger
    profiles:
      - microservices


  jaeger:
    container_name: jaeger
    hostname: jaeger
    image: jaegertracing/all-in-one:latest
    ports:
    - "8081:16686"
    - "14250"
    - "4317"
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    container_name: prometheus
    hostname: prometheus
    image: prom/prometheus:v2.54.1
    command: [ "--config.file=/etc/prometheus/prometheus-config.yml" ]
    volumes:
      - "./docker/prometheus/prometheus-config.yml:/etc/prometheus/prometheus-config.yml:ro"
    ports:
      - "9090:9090"

  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    container_name: grafana
    hostname: grafana
    image: grafana/grafana:12.0.2
    volumes:
      - ./docker/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./docker/grafana/provisioning/:/etc/grafana/provisioning/
    ports:
      - "3030:3000"


  registry:
    image: registry:2
    container_name: docker-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    profiles:
      - ci

  ####################################################################
  # MINIO
  ####################################################################
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: minio-standalone
    env_file:
      - ./docker/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: REDACTED
    command:
      - "server"
      - "/data"
      - "--address"
      - ":9096"
      - "--console-address"
      - ":9099"
    ports:
      - "9096:9096"
      - "9099:9099"
    volumes:
      - "minio-data:/data"
    profiles:
      - microservices

####################################################################
# VOLUMES
####################################################################
volumes:
  minio-data:
  pgdata:
  jsdata:
  qdrant_storage:
    driver: local
  nominatim_data: { }
  traefik-data:
    driver: local
  redis_data:
    driver: local
  redisearch_module:
    driver: local
  registry-data:

