      <<: *micro-env
      PG_CONN: "host=postgres dbname=users user=users_user password=${USERS_PASS} search_path=users,public"
      RPC_SERVICES: "USERS=users:9000"
      MOBILE_GOOGLE_OAUTH_CLIENT_ID: ${MOBILE_GOOGLE_OAUTH_CLIENT_ID}
      WEB_GOOGLE_OAUTH_CLIENT_ID: ${WEB_GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: REDACTED
      GOOGLE_AUTH_URI: ${GOOGLE_AUTH_URI}
      GOOGLE_PROJECT_ID: ${GOOGLE_PROJECT_ID}
      GOOGLE_ISSUER : ${GOOGLE_ISSUER}
