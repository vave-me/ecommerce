  string status = 2;
  google.protobuf.Timestamp released_at = 3;
}

// FulfillInventoryReservation
message FulfillInventoryReservationRequest {
  string reservation_id = 1;
}

message FulfillInventoryReservationResponse {
  string reservation_id = 1;
