syntax = "proto3";

package mediapb;

message MediaCreated {
  string id = 1;
  string item_id = 2;
  string item_type = 3;
  string user_id = 4;
  string status = 5;
}
message MediaUpdated {
  string id = 1;
  string item_id = 2;
  string item_type = 3;
  string user_id = 4;
  string status = 5;
}
message ImageAdded {
  string id = 1;
  string media_id = 2;
  int32 display_order = 3;
  bool is_main = 4;
  string url = 5;
  string metadata = 6;
  string file_type = 7;
  string thumbnail = 8;
  string user_id = 9;
}
message VideoAdded {
  string id = 1;
  string media_id = 2;
  int32 display_order = 3;
  bool is_main = 4;
  string url = 5;
  string metadata = 6;
  string file_type = 7;
  string thumbnail = 8;
  string user_id = 9;
}


message ImageRemoved {
  string id = 1;
}

message MediaRemoved {
  string id = 1;
}

message VideoRemoved {
  string id = 1;
}

// Bulk Import Events
message BulkImportStarted {
  string session_id = 1;
  string external_system_id = 2;
  string external_system_type = 3;
  int32 estimated_count = 4;
  string user_id = 5;
}

message ImportBatchAdded {
  string session_id = 1;
  int32 batch_size = 2;
  int32 batch_number = 3;
}

message ImportItemProcessed {
  string session_id = 1;
  string external_id = 2;
  string media_id = 3;
  string image_id = 4;
  string status = 5;
}

message ImportItemFailed {
  string session_id = 1;
  string external_id = 2;
  string error_code = 3;
  string error_message = 4;
  int32 retry_count = 5;
}

message BulkImportCompleted {
  string session_id = 1;
  int32 total_processed = 2;
  int32 successful_imports = 3;
  int32 failed_imports = 4;
  int64 duration_ms = 5;
}

message BulkImportCancelled {
  string session_id = 1;
  string reason = 2;
  int32 processed_at_cancellation = 3;
}
