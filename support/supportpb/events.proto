syntax = "proto3";

package supportpb;

import "google/protobuf/timestamp.proto";
import "supportpb/common.proto";

// Support Channel Events
message SupportChannelCreated {
  string id = 1;
  string user_id = 2;
  string business_id = 3;
  SupportChannelType channel_type = 4;
  SupportChannelSettings settings = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SupportChannelSettingsUpdated {
  string id = 1;
  SupportChannelSettings settings = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message SupportChannelClosed {
  string id = 1;
  string closed_by = 2;
  string reason = 3;
  google.protobuf.Timestamp closed_at = 4;
}

message SupportChannelReactivated {
  string id = 1;
  string reactivated_by = 2;
  google.protobuf.Timestamp reactivated_at = 3;
}

// Ticket Events
message TicketCreated {
  string id = 1;
  string channel_id = 2;
  string title = 3;
  string description = 4;
  TicketCategory category = 5;
  TicketPriority priority = 6;
  repeated string tags = 7;
  map<string, string> metadata = 8;
  string created_by = 9;
  repeated Attachment attachments = 10;
  google.protobuf.Timestamp created_at = 11;
}

message TicketUpdated {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional TicketCategory category = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  string updated_by = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message TicketAssigned {
  string id = 1;
  string assignee_id = 2;
  AssigneeType assignee_type = 3;
  string assigned_by = 4;
  string assignment_reason = 5;
  google.protobuf.Timestamp assigned_at = 6;
}

message TicketPriorityUpdated {
  string id = 1;
  TicketPriority old_priority = 2;
  TicketPriority new_priority = 3;
  string updated_by = 4;
  string reason = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message TicketEscalated {
  string id = 1;
  SupportTier from_tier = 2;
  SupportTier to_tier = 3;
  string escalated_by = 4;
  string escalation_reason = 5;
  string escalation_notes = 6;
  google.protobuf.Timestamp escalated_at = 7;
}

message TicketResolved {
  string id = 1;
  string resolved_by = 2;
  string resolution = 3;
  repeated string applied_solutions = 4;
  google.protobuf.Timestamp resolved_at = 5;
}

message TicketReopened {
  string id = 1;
  string reopened_by = 2;
  string reopen_reason = 3;
  int32 reopen_count = 4;
  google.protobuf.Timestamp reopened_at = 5;
}

message TicketClosed {
  string id = 1;
  string closed_by = 2;
  string closure_notes = 3;
  CustomerSatisfaction satisfaction_rating = 4;
  google.protobuf.Timestamp closed_at = 5;
}

message TicketsMerged {
  string primary_ticket_id = 1;
  repeated string secondary_ticket_ids = 2;
  string merged_by = 3;
  string merge_reason = 4;
  google.protobuf.Timestamp merged_at = 5;
}

message TicketsLinked {
  string ticket_id = 1;
  repeated string related_ticket_ids = 2;
  string linked_by = 3;
  string relationship_type = 4;
  google.protobuf.Timestamp linked_at = 5;
}

// Communication Events
message TicketReplyAdded {
  string id = 1;
  string ticket_id = 2;
  string author_id = 3;
  AuthorType author_type = 4;
  string content = 5;
  repeated Attachment attachments = 6;
  bool is_public = 7;
  google.protobuf.Timestamp created_at = 8;
}

message InternalNoteAdded {
  string id = 1;
  string ticket_id = 2;
  string author_id = 3;
  string content = 4;
  repeated string mentioned_users = 5;
  google.protobuf.Timestamp created_at = 6;
}

// AI Integration Events
message AISupportEnabled {
  string channel_id = 1;
  string assistant_id = 2;
  AIConfiguration configuration = 3;
  google.protobuf.Timestamp enabled_at = 4;
}

message AIConfigurationUpdated {
  string channel_id = 1;
  AIConfiguration configuration = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message HandoffToHumanOccurred {
  string ticket_id = 1;
  string from_assistant_id = 2;
  string to_agent_id = 3;
  string reason = 4;
  map<string, string> context = 5;
  google.protobuf.Timestamp handoff_at = 6;
}

message HandoffToAIOccurred {
  string ticket_id = 1;
  string from_agent_id = 2;
  string to_assistant_id = 3;
  map<string, string> context = 4;
  google.protobuf.Timestamp handoff_at = 5;
}

message AIResponseGenerated {
  string ticket_id = 1;
  string assistant_id = 2;
  string response = 3;
  double confidence = 4;
  repeated AISuggestion suggestions_used = 5;
  google.protobuf.Timestamp generated_at = 6;
}

// Knowledge Base Events
message KnowledgeArticleCreated {
  string id = 1;
  string title = 2;
  string content = 3;
  repeated string categories = 4;
  repeated string tags = 5;
  bool public = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ArticleLinkedToTicket {
  string ticket_id = 1;
  string article_id = 2;
  bool helped_resolve = 3;
  string linked_by = 4;
  google.protobuf.Timestamp linked_at = 5;
}

message ArticleRated {
  string article_id = 1;
  string rated_by = 2;
  int32 rating = 3;
  string feedback = 4;
  google.protobuf.Timestamp rated_at = 5;
}

// Analytics Events
message SLABreached {
  string ticket_id = 1;
  string sla_type = 2; // "first_response" or "resolution"
  int32 expected_minutes = 3;
  int32 actual_minutes = 4;
  google.protobuf.Timestamp breached_at = 5;
}

message CustomerSatisfactionRecorded {
  string ticket_id = 1;
  string customer_id = 2;
  CustomerSatisfaction rating = 3;
  string feedback = 4;
  google.protobuf.Timestamp recorded_at = 5;
}

message ResolutionTimeRecorded {
  string ticket_id = 1;
  double resolution_time_hours = 2;
  bool resolved_by_ai = 3;
  google.protobuf.Timestamp recorded_at = 4;
}