        # Jaeger UI
        location /jaeger-ui/ {
            proxy_redirect off;
            proxy_pass http://jaeger:16686;
        }

        # Zipkin trace endpoint
        location /api/traces {
            proxy_redirect off;
            proxy_pass http://jaeger:9411;
        }

        # Fallback location
        location / {
            proxy_redirect off;
            limit_except OPTIONS {
