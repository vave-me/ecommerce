                proxy_pass http://docker-products;
            }
            return 204;
        }

        location /api/posts {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-posts;
            }
            return 204;
        }
        location /posts-spec/ {
            proxy_redirect off;
