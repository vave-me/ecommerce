worker_processes 1;

events {
    worker_connections 1024;
}

http {
    map $http_origin $cors_allowed_origin {
        "https://api.sfx-markt.com" $http_origin;
        "https://sfx-markt.com" $http_origin;
        "http://192.168.178.84:3002" $http_origin;
        "http://192.168.178.84:3001" $http_origin;
        "http://192.168.178.84:3003" $http_origin;
        "http://192.168.178.84:3000" $http_origin;
        "http://172.21.0.1:3000"                $http_origin;
        "http://172.21.0.2:3000"                $http_origin;
        "http://172.21.0.3:3000"                $http_origin;
        "http://172.21.0.4:3000"                $http_origin;
        "http://172.21.0.5:3000"                $http_origin;
        "http://172.21.0.6:3000"                $http_origin;
        "http://172.21.0.7:3000"                $http_origin;
        "http://172.21.0.8:3000"                $http_origin;
        "http://127.0.0.1:3000"                $http_origin;
        "http://127.0.0.1:3001"                $http_origin;
        "http://127.0.0.1:3002"                $http_origin;
        "http://172.18.0.38:3000"                $http_origin;
        "http://172.18.0.37:3000"                $http_origin;
        "http://172.18.0.36:3000"                $http_origin;
        "http://172.18.0.35:3000"                $http_origin;
        "http://172.18.0.34:3000"                $http_origin;
        "http://172.18.0.33:3000"                $http_origin;
        "http://172.18.0.39:3000"                $http_origin;
        "http://172.21.0.9:3000"                $http_origin;
        "http://172.21.0.1:3001"                $http_origin;
        "http://172.21.0.2:3001"                $http_origin;
        "http://172.21.0.3:3001"                $http_origin;
        "http://172.21.0.4:3001"                $http_origin;
        "http://172.21.0.5:3001"                $http_origin;
        "http://172.21.0.6:3001"                $http_origin;
        "http://172.21.0.7:3001"                $http_origin;
        "http://172.21.0.8:3001"                $http_origin;
        "http://172.21.0.9:3001"                $http_origin;
        "http://46.4.91.91:3002"            $http_origin;
        "http://46.4.91.91:3000"            $http_origin;
        "http://46.4.91.91:3001"            $http_origin;
        "http://46.4.91.91:3003"            $http_origin;
        "http://46.4.91.91:8080"            $http_origin;
        "http://localhost:3000"                 $http_origin;
        "http://localhost:3001"                 $http_origin;
        "http://localhost:3002"                 $http_origin;
        # Add other allowed origins here
    }

    sendfile on;

    # Proxy Keepalive Settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Upstream definitions
    upstream docker-baskets       { server baskets:8080; keepalive 32; }
    upstream docker-ordering      { server ordering:8080; keepalive 32; }
    upstream docker-payments      { server payments:8080; keepalive 32; }
    upstream docker-shipping      { server shipping:8080; keepalive 32; }
    upstream docker-search        { server search:8080; keepalive 32; }
    upstream docker-users         { server users:8080; keepalive 32; }
    upstream docker-products      { server products:8080; keepalive 32; }
    upstream docker-vehicles      { server vehicles:8080; keepalive 32; }
    upstream docker-properties    { server properties:8080; keepalive 32; }
    upstream docker-posts         { server posts:8080; keepalive 32; }
    upstream docker-deals         { server deals:8080; keepalive 32; }
    upstream docker-jobs          { server jobs:8080; keepalive 32; }
    upstream docker-services      { server services:8080; keepalive 32; }
    upstream docker-notifications { server notifications:8080; keepalive 32; }
    upstream docker-activity      { server activity:8080; keepalive 32; }
    upstream docker-support       { server support:8080; keepalive 32; }
    upstream docker-offers        { server offers:8080; keepalive 32; }
    upstream docker-wishlists     { server wishlists:8080; keepalive 32; }
    upstream docker-newsletters   { server newsletters:8080; keepalive 32; }
    upstream docker-comments      { server comments:8080; keepalive 32; }
    upstream docker-messages      { server messages:8080; keepalive 32; }
    upstream docker-media         { server media:8080; keepalive 32; }
    upstream docker-categories    { server categories:8080; keepalive 32; }
    upstream docker-mailer        { server mailer:8080; keepalive 32; }
    upstream docker-geocoding     { server geocoding:8080; keepalive 32; }

    server {
        listen 8080;

        # Common proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Global CORS headers
        add_header Access-Control-Allow-Origin      $cors_allowed_origin always;
        add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers     "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;

        ########################################################################
        # Pattern for each location:
        #
        #   location /some/path {
        #       proxy_redirect off;   # allowed in 'location' block
        #
        #       limit_except OPTIONS {
        #           proxy_pass http://some-upstream;
        #       }
        #
        #       # If method == OPTIONS => we skip limit_except block => return 204
        #       return 204;
        #   }
        ########################################################################

        location /api/baskets {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-baskets;
            }
            return 204;
        }
        location /baskets-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-baskets;
            }
            return 204;
        }

        location /api/ordering {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-ordering;
            }
            return 204;
        }
        location /ordering-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-ordering;
            }
            return 204;
        }

        location /api/payments {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-payments;
            }
            return 204;
        }
        location /payments-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-payments;
            }
            return 204;
        }

        location /api/search {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-search;
            }
            return 204;
        }
        location /search-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-search;
            }
            return 204;
        }

        location /api/notifications {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-notifications;
            }
            return 204;
        }
        location /notifications-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-notifications;
            }
            return 204;
        }

        location /api/activity {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-activity;
            }
            return 204;
        }
        location /activity-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-activity;
            }
            return 204;
        }

        location /api/newsletters {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-newsletters;
            }
            return 204;
        }
        location /newsletters-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-newsletters;
            }
            return 204;
        }

        location /api/offers {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-offers;
            }
            return 204;
        }
        location /offers-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-offers;
            }
            return 204;
        }

        location /api/wishlists {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-wishlists;
            }
            return 204;
        }
        location /wishlists-spec/ {
            proxy_redirect off;
            limit_except OPTIONS {
