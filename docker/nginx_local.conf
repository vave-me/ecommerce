                proxy_pass http://docker-support;
            }
            return 204;
        }

        location /api/messages {
            proxy_redirect off;
            limit_except OPTIONS {
                proxy_pass http://docker-messages;
            }
            return 204;
        }
        location /messages-spec/ {
            proxy_redirect off;
