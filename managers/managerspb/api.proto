syntax = "proto3";

package managerspb;

import "managerspb/common_manager.proto";
import "managerspb/events.proto";

// ManagerService provides AI manager functionality
service ManagersService {
  // Manager Management (Internal/Admin only)
  rpc CreateManager(CreateManagerRequest) returns (CreateManagerResponse);
  rpc ActivateManager(ActivateManagerRequest) returns (ActivateManagerResponse);
  rpc DeactivateManager(DeactivateManagerRequest) returns (DeactivateManagerResponse);
  rpc UpdateManagerConfiguration(UpdateManagerConfigurationRequest) returns (UpdateManagerConfigurationResponse);
  rpc GetManager(GetManagerRequest) returns (GetManagerResponse);
  rpc GetManagers(GetManagersRequest) returns (GetManagersResponse);
  rpc ProcessUserInput(ProcessUserInputRequest) returns (ProcessUserInputResponse);
  rpc ProcessSpeechInput(ProcessSpeechInputRequest) returns (ProcessSpeechInputResponse);
  rpc ProcessImageInput(ProcessImageInputRequest) returns (ProcessImageInputResponse);
  rpc ProcessDocumentInput(ProcessDocumentInputRequest) returns (ProcessDocumentInputResponse);
  rpc ProcessManagerRequest(ProcessManagerRequestRequest) returns (ProcessManagerRequestResponse);


  // Conversation Management
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc GetUserConversations(GetUserConversationsRequest) returns (GetUserConversationsResponse);
  rpc GetConversationMessages(GetConversationMessagesRequest) returns (GetConversationMessagesResponse);
  rpc GetConversationStats(GetConversationStatsRequest) returns (GetConversationStatsResponse);
  rpc AddMessageToConversation(AddMessageToConversationRequest) returns (AddMessageToConversationResponse);
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);
  rpc UpdateConversationContext(UpdateConversationContextRequest) returns (UpdateConversationContextResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  rpc ArchiveConversation(ArchiveConversationRequest) returns (ArchiveConversationResponse);
  rpc ChatWithConversation(ChatWithConversationRequest) returns (ChatWithConversationResponse);
}

// Get Manager Request
message GetManagerRequest {
  string id = 1;
}

message GetManagersRequest {
  int32 page = 1;
  int32 limit = 2;
}
message GetManagersResponse {
  repeated Manager managers = 1;
  int32 total_count = 2;
}

message GetManagerResponse {
  Manager manager = 1;
}

// Create Manager Request
message CreateManagerRequest {
  string name = 1;
  string description = 2;
  string user_id = 3;
  ManagerType type = 4;
  repeated ManagerCapability capabilities = 5;
  double temperature = 6;
  int32 max_tokens = 7;
  string system_prompt = 8;
}

message CreateManagerResponse {
  string manager_id = 1;
}

// Process User Request
message ProcessUserInputRequest {
  string manager_id = 1;
  string message = 2;
  map<string, string> context = 3;
  string request_type = 4;
}

message ProcessUserInputResponse {
  string id = 1;
  string request_id = 2;
  string message = 3;
  map<string, string> data = 4;
  repeated ManagerAction actions = 5;
  string timestamp = 6;
  string status = 7;
  double confidence = 8;
}

// Process Speech Input Request
message ProcessSpeechInputRequest {
  string manager_id = 1;
  bytes audio_data = 2;
  string audio_format = 3;
  string language = 4;
  map<string, string> context = 5;
  string request_type = 6;
}

message ProcessSpeechInputResponse {
  string id = 1;
  string request_id = 2;
  string transcribed_text = 3;
  string message = 4;
  map<string, string> data = 5;
  repeated ManagerAction actions = 6;
  string timestamp = 7;
  string status = 8;
  double confidence = 9;
  double transcription_confidence = 10;
}

// Process Image Input Request
message ProcessImageInputRequest {
  string manager_id = 1;
  bytes image_data = 2;        // Raw image data (direct upload)
  string image_url = 3;        // URL to image (public or signed URL)
  string image_format = 4;     // jpeg, png, webp, gif, etc.
  string analysis_type = 5;    // describe, ocr, objects, etc.
  string user_prompt = 6;      // User's specific request about the image
  map<string, string> context = 7;
  string request_type = 8;
}

message ProcessImageInputResponse {
  string id = 1;
  string request_id = 2;
  string analysis_result = 3;
  string message = 4;
  map<string, string> data = 5;
  repeated ManagerAction actions = 6;
  string timestamp = 7;
  string status = 8;
  double confidence = 9;
  double analysis_confidence = 10;
}

// Process Document Input Request
message ProcessDocumentInputRequest {
  string manager_id = 1;

  // Document input options - use either document_data OR document_url
  bytes document_data = 2;        // Raw document data (direct upload)
  string document_url = 3;        // URL to document (public or signed URL)

  string document_format = 4;     // pdf, docx, csv, xlsx, txt, etc.
  string analysis_type = 5;       // extract_text, analyze_structure, summarize, etc.
  string user_prompt = 6;         // User's specific request about the document
  map<string, string> context = 7;
  string request_type = 8;
}

message ProcessDocumentInputResponse {
  string id = 1;
  string request_id = 2;
  string extracted_content = 3;   // Extracted text/data from document
  string analysis_result = 4;     // Analysis result summary
  string message = 5;             // AI manager response
  map<string, string> data = 6;   // Additional metadata (pages, size, etc.)
  repeated ManagerAction actions = 7;
  string timestamp = 8;
  string status = 9;
  double confidence = 10;
  double processing_confidence = 11; // Document processing confidence
  int32 word_count = 12;           // Word count of extracted content
  int32 page_count = 13;           // Number of pages (for documents)
}


message ActivateManagerRequest {
  string id = 1;
}

message ActivateManagerResponse{

}

message DeactivateManagerRequest {
  string id = 1;
}

message DeactivateManagerResponse {

}

message UpdateManagerConfigurationRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional double temperature = 4;
  optional int32 max_tokens = 5;
  optional string system_prompt = 6;
  repeated ManagerCapability capabilities = 7;
}

message UpdateManagerConfigurationResponse {

}

message GetActiveManagersRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetActiveManagersResponse {
  repeated Manager managers = 1;
  int32 total_count = 2;
}

message ProcessManagerRequestRequest {
  string manager_id = 1;
  string request_id = 2;
  string message = 3;
  map<string, string> context = 4;


}

message ProcessManagerRequestResponse {
  string id = 1;
  string request_id = 2;
  string message = 3;
  map<string, string> data = 4;
  repeated ManagerAction actions = 5;
  string timestamp = 6;
  string status = 7;
  double confidence = 8;
  string manager_id = 9;
  string user_id = 10;
}




// Create Conversation
message CreateConversationRequest {
  string manager_id = 1;
  map<string, string> initial_context = 2;
}

message CreateConversationResponse {
  string conversation_id = 1;
}

// Get Conversation
message GetConversationRequest {
  string conversation_id = 1;

}

message GetConversationResponse {
  Conversation conversation = 1;
}

// Get User Conversations
message GetUserConversationsRequest {
  bool active_only = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetUserConversationsResponse {
  repeated Conversation conversations = 1;
  int32 total_count = 2;
}

// Get Conversation Messages
message GetConversationMessagesRequest {
  string conversation_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetConversationMessagesResponse {
  repeated ConversationMessage messages = 1;
  int32 total_count = 2;
}

// Get Conversation Stats
message GetConversationStatsRequest {
}

message GetConversationStatsResponse {
  ConversationStats stats = 1;
}

// Add Message to Conversation
message AddMessageToConversationRequest {
  string conversation_id = 1;
  string manager_id = 2;
  MessageRole role = 3;
  string content = 4;
  map<string, string> metadata = 5;
}

message AddMessageToConversationResponse {
  string message_id = 1;
}

// Update Conversation Context
message UpdateConversationContextRequest {
  string conversation_id = 1;
  map<string, string> context = 2;
}

message UpdateConversationContextResponse {
}

// Archive Conversation
message ArchiveConversationRequest {
  string conversation_id = 1;
}

message ArchiveConversationResponse {
}

// Chat with Conversation (Enhanced Chat with History)
message ChatWithConversationRequest {
  string manager_id = 1;
  string conversation_id = 2;
  string message = 3;
  map<string, string> context = 4;
  int32 max_history_messages = 5;// Optional: limit history sent to LLM
}

message ChatWithConversationResponse {
  string response = 1;
  repeated ManagerAction actions = 2;
  double confidence = 3;
  string status = 4;
  map<string, string> data = 5;
  string message_id = 6; // ID of the response message
}

// Update Conversation (Frontend-expected endpoint)
message UpdateConversationRequest {
  string conversation_id = 1;
  optional string title = 2;
  map<string, string> metadata = 3;
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

// Delete Conversation (Frontend-expected endpoint)
message DeleteConversationRequest {
  string conversation_id = 1;

}

message DeleteConversationResponse {
}

// Tool Execution Update - NEW
message ToolExecutionUpdate {
  string tool_name = 1;
  string tool_id = 2;
  string status = 3;
  double progress = 4;
  string result_summary = 5;
  string error_message = 6;
  map<string, string> parameters = 7;
  string timestamp = 8;
}