<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAZN-like Live Football Streaming Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            background: #000;
            margin-bottom: 20px;
        }

        #player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            background: #f7b500;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #e5a600;
        }

        button:disabled {
            background: #444;
            color: #999;
            cursor: not-allowed;
        }

        select {
            padding: 10px;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .stat-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #f7b500;
        }

        .stream-selector {
            margin-bottom: 20px;
        }

        .stream-card {
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .stream-card:hover {
            border-color: #f7b500;
        }

        .stream-card.active {
            border-color: #f7b500;
            background: #1a1a1a;
        }

        .stream-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stream-info {
            color: #888;
            font-size: 14px;
        }

        .quality-indicator {
            display: inline-block;
            padding: 2px 8px;
            background: #f7b500;
            color: #000;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .latency-indicator {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .latency-low {
            background: #4caf50;
            color: #fff;
        }

        .latency-medium {
            background: #ff9800;
            color: #fff;
        }

        .latency-high {
            background: #f44336;
            color: #fff;
        }

        .event-log {
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            max-height: 200px;
            overflow-y: auto;
        }

        .event-log h3 {
            margin-bottom: 10px;
        }

        .event-entry {
            font-family: monospace;
            font-size: 12px;
            color: #888;
            margin-bottom: 5px;
        }

        .event-entry.error {
            color: #f44336;
        }

        .event-entry.warning {
            color: #ff9800;
        }

        .event-entry.info {
            color: #2196f3;
        }

        .event-entry.success {
            color: #4caf50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="margin-bottom: 20px;">Live Football Streaming Demo</h1>

        <div class="stream-selector">
            <h3 style="margin-bottom: 10px;">Available Streams</h3>
            <div id="streamList"></div>
        </div>

        <div class="player-wrapper">
            <div id="player"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button id="playBtn">Play</button>
                <button id="pauseBtn">Pause</button>
            </div>

            <div class="control-group">
                <label>Quality</label>
                <select id="qualitySelect">
                    <option value="-1">Auto</option>
                </select>
            </div>

            <div class="control-group">
                <label>Protocol</label>
                <select id="protocolSelect">
                    <option value="auto">Auto</option>
                    <option value="hls">HLS</option>
                    <option value="dash">DASH</option>
                    <option value="webrtc">WebRTC (Ultra Low Latency)</option>
                </select>
            </div>

            <div class="control-group">
                <button id="statsBtn">Toggle Stats</button>
            </div>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Bitrate</div>
                <div class="stat-value" id="bitrateStat">0 Mbps</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Buffer</div>
                <div class="stat-value" id="bufferStat">0s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Dropped Frames</div>
                <div class="stat-value" id="droppedStat">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Latency</div>
                <div class="stat-value" id="latencyStat">
                    <span id="latencyValue">0ms</span>
                    <span id="latencyIndicator" class="latency-indicator latency-low">LOW</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Quality Level</div>
                <div class="stat-value" id="qualityStat">
                    <span id="qualityValue">Auto</span>
                    <span class="quality-indicator" id="qualityIndicator">HD</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Connection</div>
                <div class="stat-value" id="connectionStat">Disconnected</div>
            </div>
        </div>

        <div class="event-log">
            <h3>Event Log</h3>
            <div id="eventLog"></div>
        </div>
    </div>

    <!-- Include required libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    
    <!-- Include our SDK -->
    <script src="video_player_sdk.js"></script>

    <script>
        // Demo streams configuration
        const demoStreams = [
            {
                id: 'premier-league-1',
                title: 'Manchester United vs Liverpool',
                competition: 'Premier League',
                homeTeam: 'Manchester United',
                awayTeam: 'Liverpool',
                startTime: new Date().toISOString(),
                hlsUrl: '/hls/premier-league-1/master.m3u8',
                dashUrl: '/dash/premier-league-1/manifest.mpd',
                webrtcId: 'premier-league-1',
                drm: {
                    widevine: {
                        licenseUrl: '/api/drm/widevine/license',
                        headers: {
                            'X-Custom-Header': 'value'
                        }
                    }
                }
            },
            {
                id: 'champions-league-1',
                title: 'Real Madrid vs Bayern Munich',
                competition: 'Champions League',
                homeTeam: 'Real Madrid',
                awayTeam: 'Bayern Munich',
                startTime: new Date().toISOString(),
                hlsUrl: '/hls/champions-league-1/master.m3u8',
                dashUrl: '/dash/champions-league-1/manifest.mpd',
                webrtcId: 'champions-league-1'
            }
        ];

        // Initialize player
        const player = new VideoPlayerSDK({
            autoplay: false,
            controls: true,
            debug: false,
            lowLatencyMode: true,
            adaptiveBitrate: true,
            statsInterval: 1000,
            webrtcConfig: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' }
                ]
            }
        });

        // Initialize player with container
        player.init('#player');

        // Current stream
        let currentStream = null;

        // Setup stream list
        function setupStreamList() {
            const streamList = document.getElementById('streamList');
            streamList.innerHTML = '';

            demoStreams.forEach(stream => {
                const card = document.createElement('div');
                card.className = 'stream-card';
                card.innerHTML = `
                    <div class="stream-title">${stream.title}</div>
                    <div class="stream-info">
                        ${stream.competition} • ${stream.homeTeam} vs ${stream.awayTeam}
                    </div>
                `;
                
                card.addEventListener('click', () => selectStream(stream));
                streamList.appendChild(card);
            });
        }

        // Select and load stream
        function selectStream(stream) {
            currentStream = stream;
            
            // Update UI
            document.querySelectorAll('.stream-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Get selected protocol
            const protocol = document.getElementById('protocolSelect').value;
            let streamUrl;
            
            switch (protocol) {
                case 'hls':
                    streamUrl = stream.hlsUrl;
                    break;
                case 'dash':
                    streamUrl = stream.dashUrl;
                    break;
                case 'webrtc':
                    streamUrl = stream.webrtcId;
                    break;
                default:
                    streamUrl = stream.hlsUrl; // Default to HLS
            }

            // Load stream with DRM config if available
            const options = {
                preferredProtocol: protocol,
                drmConfig: stream.drm || {}
            };

            player.load(streamUrl, options).catch(error => {
                logEvent('Failed to load stream: ' + error.message, 'error');
            });
        }

        // Setup controls
        document.getElementById('playBtn').addEventListener('click', () => {
            player.play();
        });

        document.getElementById('pauseBtn').addEventListener('click', () => {
            player.pause();
        });

        document.getElementById('qualitySelect').addEventListener('change', (e) => {
            player.setQuality(parseInt(e.target.value));
        });

        document.getElementById('protocolSelect').addEventListener('change', (e) => {
            if (currentStream) {
                selectStream(currentStream);
            }
        });

        document.getElementById('statsBtn').addEventListener('click', () => {
            const stats = document.getElementById('stats');
            stats.style.display = stats.style.display === 'none' ? 'grid' : 'none';
        });

        // Setup player event listeners
        player.on('loadstart', () => {
            logEvent('Loading stream...', 'info');
            updateConnectionStatus('Connecting...');
        });

        player.on('play', () => {
            logEvent('Playback started', 'success');
        });

        player.on('pause', () => {
            logEvent('Playback paused', 'info');
        });

        player.on('error', (error) => {
            logEvent('Error: ' + error.message, 'error');
            updateConnectionStatus('Error');
        });

        player.on('levelsloaded', (levels) => {
            logEvent(`Loaded ${levels.length} quality levels`, 'info');
            updateQualityOptions(levels);
        });

        player.on('qualitychanged', (data) => {
            logEvent(`Quality changed to level ${data.level}`, 'info');
        });

        player.on('stats', (stats) => {
            updateStats(stats);
        });

        player.on('canplay', () => {
            updateConnectionStatus('Connected');
        });

        player.on('waiting', () => {
            updateConnectionStatus('Buffering...');
        });

        // WebRTC specific events
        player.on('webrtc:connected', () => {
            logEvent('WebRTC signaling connected', 'success');
        });

        player.on('webrtc:connectionstate', (state) => {
            logEvent(`WebRTC connection state: ${state}`, 'info');
            if (state === 'connected') {
                updateConnectionStatus('Connected (WebRTC)');
            }
        });

        // Update quality options
        function updateQualityOptions(levels) {
            const select = document.getElementById('qualitySelect');
            select.innerHTML = '<option value="-1">Auto</option>';
            
            levels.forEach((level, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = `${level.height}p (${(level.bitrate / 1000000).toFixed(1)} Mbps)`;
                select.appendChild(option);
            });
        }

        // Update statistics display
        function updateStats(stats) {
            // Bitrate
            const bitrateMbps = (stats.bitrate / 1000).toFixed(2);
            document.getElementById('bitrateStat').textContent = `${bitrateMbps} Mbps`;

            // Buffer
            document.getElementById('bufferStat').textContent = `${stats.bufferedDuration.toFixed(1)}s`;

            // Dropped frames
            document.getElementById('droppedStat').textContent = stats.droppedFrames;

            // Latency
            const latencyMs = stats.latency;
            document.getElementById('latencyValue').textContent = `${latencyMs}ms`;
            
            const latencyIndicator = document.getElementById('latencyIndicator');
            if (latencyMs < 1000) {
                latencyIndicator.className = 'latency-indicator latency-low';
                latencyIndicator.textContent = 'LOW';
            } else if (latencyMs < 3000) {
                latencyIndicator.className = 'latency-indicator latency-medium';
                latencyIndicator.textContent = 'MEDIUM';
            } else {
                latencyIndicator.className = 'latency-indicator latency-high';
                latencyIndicator.textContent = 'HIGH';
            }

            // Quality
            if (stats.qualityLevel === -1) {
                document.getElementById('qualityValue').textContent = 'Auto';
            } else if (stats.qualityLevels[stats.qualityLevel]) {
                const quality = stats.qualityLevels[stats.qualityLevel];
                document.getElementById('qualityValue').textContent = `${quality.height}p`;
                
                const indicator = document.getElementById('qualityIndicator');
                if (quality.height >= 2160) {
                    indicator.textContent = '4K';
                } else if (quality.height >= 1080) {
                    indicator.textContent = 'FHD';
                } else if (quality.height >= 720) {
                    indicator.textContent = 'HD';
                } else {
                    indicator.textContent = 'SD';
                }
            }
        }

        // Update connection status
        function updateConnectionStatus(status) {
            document.getElementById('connectionStat').textContent = status;
        }

        // Log events
        function logEvent(message, type = 'info') {
            const log = document.getElementById('eventLog');
            const entry = document.createElement('div');
            entry.className = `event-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 50 entries
            while (log.children.length > 50) {
                log.removeChild(log.lastChild);
            }
        }

        // Initialize
        setupStreamList();
        logEvent('Player initialized', 'success');
    </script>
</body>
</html>
