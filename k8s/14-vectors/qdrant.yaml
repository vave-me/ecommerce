# --- Qdrant Vector Database Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: vectors
  labels:
    app: qdrant
    role: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
      role: vector-db
  template:
    metadata:
      labels:
        app: qdrant
        role: vector-db
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.14.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            - name: QDRANT__LOG_LEVEL
              value: "INFO"
          readinessProbe:
            httpGet:
              path: /
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 6333
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-storage
          persistentVolumeClaim:
            claimName: qdrant-pvc
---
# --- Qdrant Service ---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: vectors
  labels:
    app: qdrant
    role: vector-db
spec:
  type: ClusterIP
  selector:
    app: qdrant
    role: vector-db
  ports:
    - name: http
      port: 6333
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 6334
      targetPort: grpc
      protocol: TCP
---
# --- Qdrant Persistent Volume Claim ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-pvc
  namespace: vectors
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi 