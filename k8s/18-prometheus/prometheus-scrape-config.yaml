# Additional Prometheus scrape configuration for services
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-scrape-config
  namespace: observability
data:
  prometheus-additional.yml: |
    # Additional scrape configurations for services
    # Based on Docker prometheus configuration
    
    scrape_configs:
      # Service discovery for all services in my-project namespace
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - my-project
        relabel_configs:
          # Only scrape services with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use prometheus.io/port annotation or default to 8080
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+)
            replacement: $1
          - source_labels: [__address__, __meta_kubernetes_service_port_name]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(http|metrics)
            replacement: $1:8080
          # Set instance label
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: instance
          # Set job label from service name
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: job
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
      
      # Individual service configs with explicit targets
      - job_name: 'baskets'
        static_configs:
          - targets: ['baskets.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'notifications'
        static_configs:
          - targets: ['notifications.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'activity'
        static_configs:
          - targets: ['activity.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'comments'
        static_configs:
          - targets: ['comments.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'ordering'
        static_configs:
          - targets: ['ordering.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'payments'
        static_configs:
          - targets: ['payments.my-project.svc.cluster.local:80']
        metrics_path: '/metrics'
      
      - job_name: 'search'
