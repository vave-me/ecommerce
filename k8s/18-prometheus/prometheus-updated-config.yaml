# Updated Prometheus ConfigMap with service scraping
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'production'
        environment: 'k8s'
    
    # Alertmanager configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    
    # Rule files configuration
    rule_files:
      - '/etc/prometheus/rules/*.yml'
      - '/etc/prometheus/additional/*.yml'
    
    # Scrape configurations
    scrape_configs:
      # OpenTelemetry Collector metrics
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'otel_traces_span_metrics.*'
            action: keep
      
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
      
      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
      
      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
      
      # Kubernetes pods
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
      
      # Service discovery for all services in my-project namespace
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - my-project
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
            action: replace
            target_label: __scheme__
            regex: (https?)
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: job
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            action: replace
            target_label: service
      
      # Individual service targets (as fallback)
      - job_name: 'my-project-services'
        static_configs:
          - targets:
              - 'baskets.my-project.svc.cluster.local:80'
              - 'notifications.my-project.svc.cluster.local:80'
              - 'activity.my-project.svc.cluster.local:80'
              - 'comments.my-project.svc.cluster.local:80'
              - 'ordering.my-project.svc.cluster.local:80'
              - 'payments.my-project.svc.cluster.local:80'
              - 'search.my-project.svc.cluster.local:80'
              - 'users.my-project.svc.cluster.local:80'
              - 'posts.my-project.svc.cluster.local:80'
              - 'messages.my-project.svc.cluster.local:80'
              - 'newsletters.my-project.svc.cluster.local:80'
              - 'support.my-project.svc.cluster.local:80'
              - 'wishlists.my-project.svc.cluster.local:80'
              - 'offers.my-project.svc.cluster.local:80'
              - 'products.my-project.svc.cluster.local:80'
              - 'media.my-project.svc.cluster.local:80'
              - 'cosec.my-project.svc.cluster.local:80'
              - 'scheduler.my-project.svc.cluster.local:80'
              - 'services.my-project.svc.cluster.local:80'
              - 'categories.my-project.svc.cluster.local:80'
              - 'following.my-project.svc.cluster.local:80'
              - 'geocoding.my-project.svc.cluster.local:80'
              - 'mailer.my-project.svc.cluster.local:80'
              - 'metrics.my-project.svc.cluster.local:80'
              - 'reviews.my-project.svc.cluster.local:80'
              - 'shipping.my-project.svc.cluster.local:80'
              - 'vectors.my-project.svc.cluster.local:80'
              - 'assistants.my-project.svc.cluster.local:80'
        metrics_path: '/metrics'
        relabel_configs:
          - source_labels: [__address__]
            regex: '([^:]+)\..*'
            target_label: service
            replacement: '$1'
      
      # Infrastructure services
      - job_name: 'infrastructure'
        static_configs:
          - targets:
              - 'grafana.observability.svc.cluster.local:3000'
              - 'jaeger-query.observability.svc.cluster.local:16687'
        metrics_path: '/metrics'