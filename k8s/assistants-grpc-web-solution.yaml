# Solution: gRPC-Web with Envoy Proxy for Authentication
---
# Envoy Proxy ConfigMap for gRPC-Web + Auth Headers
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-grpc-config
  namespace: my-project
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address: { address: 0.0.0.0, port_value: 8080 }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: grpc_json
              route_config:
                name: local_route
                virtual_hosts:
                - name: local_service
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route: 
                      cluster: assistants_grpc
                      timeout: 60s
                  cors:
                    allow_origin_string_match:
                    - prefix: "*"
                    allow_methods: GET, PUT, DELETE, POST, OPTIONS
                    allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
                    max_age: "1728000"
                    expose_headers: custom-header-1,grpc-status,grpc-message
              http_filters:
              # Add authentication header conversion
              - name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  inline_code: |
                    function envoy_on_request(request_handle)
                      -- Convert HTTP Authorization header to gRPC metadata
                      local auth_header = request_handle:headers():get("authorization")
                      if auth_header then
                        request_handle:headers():add("x-auth-token", auth_header)
                      end
                      
                      -- Convert API Key header
                      local api_key = request_handle:headers():get("x-api-key")
                      if api_key then
                        request_handle:headers():add("x-grpc-api-key", api_key)
                      end
                    end
              - name: envoy.filters.http.grpc_web
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
              - name: envoy.filters.http.cors
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: assistants_grpc
        connect_timeout: 0.25s
        type: logical_dns
        http2_protocol_options: {}
        lb_policy: round_robin
        load_assignment:
          cluster_name: assistants_grpc
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: assistants.my-project.svc.cluster.local
                    port_value: 9000
---
# Envoy Proxy Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistants-grpc-web
  namespace: my-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assistants-grpc-web
  template:
    metadata:
      labels:
        app: assistants-grpc-web
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
        command: ["/usr/local/bin/envoy"]
        args: ["-c", "/etc/envoy/envoy.yaml"]
      volumes:
      - name: config
        configMap:
          name: envoy-grpc-config
---
# Service for Envoy Proxy
apiVersion: v1
kind: Service
metadata:
  name: assistants-grpc-web
  namespace: my-project
spec:
  selector:
    app: assistants-grpc-web
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
# Update Ingress to route to Envoy instead of direct service
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: assistants-grpc-web-ingress
  namespace: my-project
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: my-project-cors-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - api.sfx-markt.de
    secretName: api-tls
  rules:
  - host: api.sfx-markt.de
    http:
      paths:
      - path: /api/assistants
        pathType: Prefix
        backend:
          service:
            name: assistants-grpc-web  # Route to Envoy, not direct service
            port:
              number: 80 