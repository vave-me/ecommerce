# --- Redis Master Deployment (Corrected) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-master
  namespace: redis
  labels:
    app: redis
    role: master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      role: master
  template:
    metadata:
      labels:
        app: redis
        role: master
    spec:
      containers:
        - name: redis-stack-server # Container name from your original YAML
          # Recommend pinning version instead of :latest for stability
          image: redis/redis-stack-server:7.2.0-v10 # Pinned version example
          imagePullPolicy: IfNotPresent
          command: [ "redis-stack-server" ]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)" # Uses Kubernetes env var substitution
            # Add other args if needed, e.g., for persistence:
            # - "--save"
            # - "60 1" # Example: Save every 60s if at least 1 key changed
            # - "--appendonly"
            # - "yes"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Ensure this secret exists in the 'redis' namespace
                  name: redis-secret
                  key: REDIS_PASSWORD
          ports:
            - containerPort: 6379
              name: redis # Port name used by Service targetPort
            # - containerPort: 8001 # Optional RedisInsight port
            #   name: insight
          readinessProbe:
            exec:
              # Assumes 'sh' and 'redis-cli' are in the image
              command: [ "sh", "-c", "export REDISCLI_AUTH=$REDIS_PASSWORD; redis-cli PING | grep PONG" ]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              # Assumes 'sh' and 'redis-cli' are in the image
              command: [ "sh", "-c", "export REDISCLI_AUTH=$REDIS_PASSWORD; redis-cli PING | grep PONG" ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: redis-data
              mountPath: /data # Standard data path for Redis
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            # --- CORRECTED INDENTATION ---
            # Ensure 'redis-pvc' PVC exists in the 'redis' namespace
            claimName: redis-pvc
---
# --- Redis Master Service ---
apiVersion: v1
kind: Service
metadata:
  name: redis-master # You can name this just 'redis-master' if you prefer
  namespace: redis
  labels:
    # Labels can match the deployment or be specific to the service
    app: redis
    role: master
spec:
  type: ClusterIP # Default - exposes service internally within the cluster
  selector:
    # These labels MUST match the labels in the Deployment's 'spec.template.metadata.labels'
    app: redis
    role: master
  ports:
    - name: redis
      port: 6379       # Port the service will listen on
      targetPort: redis # Connects to the container port named 'redis' (which is 6379)
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc         # <-- This is the required name
  namespace: redis
  # labels: # Optional
  #  app: redis
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Ensure this StorageClass exists
  resources:
    requests:
      storage: 5Gi         # Adjust size if needed
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret  # Must match the name used in the Deployment env var
  namespace: redis
type: Opaque # Default type for arbitrary key-value pairs
data:
  # Key must match the 'key' used in the Deployment env var
  # Value is the Base64 encoded password (e.g., 'changeMePlease123')
  REDIS_PASSWORD: REDACTED