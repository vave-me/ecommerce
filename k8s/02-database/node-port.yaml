apiVersion: v1
kind: Service
metadata:
  name: postgres-db-nodeport # Or another suitable name
  namespace: database
spec:
  type: LoadBalancer
  selector:
    app: postgres-db # Matches the label on your postgres-db-0 pod
  ports:
    - protocol: TCP
      port: 5432       # Internal cluster port for the service
      targetPort: 5432   # Port on the pod (containerPort)
      # nodePort: 30432 # Optional: Specify a NodePort, otherwise one is auto-assigned