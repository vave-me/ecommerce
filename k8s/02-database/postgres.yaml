apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: database
type: Opaque
data:
  POSTGRES_PASSWORD: REDACTED
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: database
data:
  01-init-commondb.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        SELECT 1 FROM pg_database WHERE datname = 'commondb' \gexec
        CREATE DATABASE commondb TEMPLATE template0;
    EOSQL

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "commondb" <<-EOSQL
        CREATE OR REPLACE FUNCTION created_at_trigger() RETURNS TRIGGER AS \$\$
        BEGIN NEW.created_at := OLD.created_at; RETURN NEW; END;
        \$\$ LANGUAGE 'plpgsql';

        CREATE OR REPLACE FUNCTION updated_at_trigger() RETURNS TRIGGER AS \$\$
        BEGIN
          IF row(NEW.*) IS DISTINCT FROM row(OLD.*) THEN
            NEW.updated_at = NOW(); RETURN NEW;
          ELSE RETURN OLD; END IF;
        END;
        \$\$ LANGUAGE 'plpgsql';
        GRANT EXECUTE ON FUNCTION created_at_trigger() TO public;
        GRANT EXECUTE ON FUNCTION updated_at_trigger() TO public;
    EOSQL
    echo "Common DB 'commondb' and functions ensured."
  02-init-extensions.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE EXTENSION IF NOT EXISTS postgis;
    EOSQL
    echo "PostGIS extension checked/created in database '$POSTGRES_DB'."
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: database
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: postgres
  selector:
    app: postgres-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: database
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  namespace: database
  labels:
    app: postgres-db
spec:
  serviceName: postgres-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: postgres-db
  template:
    metadata:
      labels:
        app: postgres-db
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgis/postgis:16-3.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: "postgres"
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-h", "localhost", "-p", "5432" ]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [ "pg_isready", "-U", "postgres", "-h", "localhost", "-p", "5432" ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: init-scripts
          configMap:
            name: postgresql-init-scripts
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi