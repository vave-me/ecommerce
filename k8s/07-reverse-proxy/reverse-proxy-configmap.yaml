# reverse-proxy-configmap-fixed.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy-config # Must match the name used in the Deployment volume mount
  namespace: my-project
data:
  # The key must match the filename expected by the mount path (nginx.conf)
  nginx.conf: |
    # Basic Nginx configuration focused on passing health checks
    worker_processes auto; # Use 'auto' to adapt to available cores

    events {
      worker_connections 1024; # Default, adjust if needed
    }

    http {
      # Define standard MIME types
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      # Logging format (optional, good for debugging)
      log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

      access_log  /var/log/nginx/access.log  main;
      error_log   /var/log/nginx/error.log warn;

      sendfile        on;
      tcp_nopush      on;
      keepalive_timeout 65;
      # tcp_nodelay     on; # Uncomment if needed

      # Basic server block listening on the port defined in the deployment
      server {
        listen 8080; # Matches the containerPort in the reverse-proxy Deployment
        server_name _; # Catch-all

        # Default location (serves Nginx default page or 404 if page not found)
        location / {
          root   /usr/share/nginx/html; # Default Nginx document root
          index  index.html index.htm;
          try_files $uri $uri/ =404;     # Return 404 if file not found
        }

        # Health check endpoint for Kubernetes probes
        location = /nginx_status {
          # Enables the Nginx status page module
          stub_status;
          # Optional: Turn off logging for health checks to reduce noise
          access_log off;

          # --- IMPORTANT SECURITY ---
          # Allow access ONLY from necessary sources.
          allow 127.0.0.1;  # Allow access from within the pod itself

          # Allow access from the Kubernetes probe source IPs.
          # This IP range DEPENDS ON YOUR CLUSTER'S CNI (Network Plugin).
          # The IP 10.42.0.1 seen in logs suggests a pod network like 10.42.0.0/16.
          # VERIFY THIS RANGE FOR YOUR SPECIFIC CLUSTER SETUP.
          # If probes come directly from Node IPs, allow that range instead.
          allow 10.42.0.0/16;  # <----- *** VERIFY THIS CIDR FOR YOUR CLUSTER ***

          # Deny all other IPs trying to access the status page
          deny all;
          # --- --------------------
        }

        # Optional: Define custom error pages
        error_page 404 /404.html;
          location = /40x.html {
            root /usr/share/nginx/html;
        }
        error_page 500 502 503 504 /50x.html;
          location = /50x.html {
            root /usr/share/nginx/html;
        }
      }
    }