apiVersion: v1
kind: Secret
metadata:
  name: users-secrets
  namespace: my-project
type: Opaque
data:
  USERS_PASS: REDACTED
  MOBILE_GOOGLE_OAUTH_CLIENT_ID: MTAxODk4NDI1OTIyMi02MjQ3Z2ptdTgyNGNycDQ2MDM4ajM3aW1obWFoYzBnNC5hcHBzLmdvb2dsZXVzZXJjb250ZW50LmNvbQ== # Example: echo -n '1018984259222-6247gjmu824crp46038j37imhmahc0g4.apps.googleusercontent.com' | base64
  WEB_GOOGLE_OAUTH_CLIENT_ID: MjE4NTk3MDk3NjUyLXFzaXVqbTNlcmFkMTFlN21hdHBpcWxucDg5ZGk2NWZrLmFwcHMuZ29vZ2xldXNlcmNvbnRlbnQuY29t # Example: echo -n '218597097652-qsiujm3erad11e7matpiqlnp89di65fk.apps.googleusercontent.com' | base64
  GOOGLE_CLIENT_SECRET: REDACTED
  GOOGLE_AUTH_URI: aHR0cHM6Ly9hY2NvdW50cy5nb29nbGUuY29tL28vb2F1dGgyL2F1dGg= # Example: echo -n 'https://accounts.google.com/o/oauth2/auth' | base64
  GOOGLE_PROJECT_ID: c2Z4LW1hcmt0 # Example: echo -n 'sfx-markt' | base64
  GOOGLE_ISSUER : aHR0cHM6Ly9hY2NvdW50cy5nb29nbGUuY29t  # Example: echo -n 'https://accounts.google.com' | base64
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: my-project
  labels:
    app: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: USERS_PASS
          command: [ 'sh', '-c' ]
          args:
            - |
              set -e
              echo "Waiting for postgres service (postgres.database.svc.cluster.local:5432) to accept connections for user users_user..."
              until psql -h postgres.database.svc.cluster.local -U users_user -d users -c "SELECT 1;" > /dev/null 2>&1; do
                echo "Postgres not ready yet for user users_user, sleeping for 2 seconds..."
                sleep 2
              done
              echo "Postgres service is ready for user users_user!"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        - name: wait-for-nats
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for nats (nats.messaging.svc.cluster.local:4222)..."; until nc -zv nats.messaging.svc.cluster.local 4222; do sleep 2; done; echo "NATS ready!"' ]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: users
          image: registry.sfx-markt.de/users:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9000
              name: grpc
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secrets
          env:
            - name: PG_CONN
              value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) dbname=users user=users_user search_path=users,public sslmode=disable password=users_pass"
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_PORT
            - name: PGDATABASE
              value: "users"
            - name: PGUSER
              value: "users_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: USERS_PASS
            - name: WEB_GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: WEB_GOOGLE_OAUTH_CLIENT_ID
            - name: MOBILE_GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: MOBILE_GOOGLE_OAUTH_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_AUTH_URI
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: GOOGLE_AUTH_URI
            - name: GOOGLE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: GOOGLE_PROJECT_ID
            - name: GOOGLE_ISSUER 
              valueFrom:
                secretKeyRef:
                  name: users-secrets
                  key: GOOGLE_ISSUER 
            - name: PGSSLMODE
              value: "disable"
            - name: RPC_SERVICES
              value: "USERS=users.my-project.svc.cluster.local:9000"
            - name: OTEL_SERVICE_NAME
              value: "users"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: users
  namespace: my-project
  labels:
    app: users
spec:
  selector:
    app: users
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc-internal
      port: 9000
      targetPort: grpc
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: users-external # External service for LoadBalancer exposure
  namespace: my-project
  labels:
    app: users
spec:
  selector:
    app: users
  ports:
    - name: grpc-external
      protocol: TCP
      port: 30001
      targetPort: grpc
  type: LoadBalancer   # Exposed externally by MetalLB