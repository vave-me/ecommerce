apiVersion: v1
kind: Secret
metadata:
  name: scheduler-secrets
  namespace: my-project
type: Opaque
data:
  SCHEDULER_PASS: REDACTED
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: my-project
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: SCHEDULER_PASS
          command: [ 'sh', '-c' ]
          args:
            - |
              set -e
              echo "Waiting for postgres service (postgres.database.svc.cluster.local:5432) to accept connections for user scheduler_user..."
              until psql -h postgres.database.svc.cluster.local -U scheduler_user -d scheduler -c "SELECT 1;" > /dev/null 2>&1; do
                echo "Postgres not ready yet for user scheduler_user, sleeping for 2 seconds..."
                sleep 2
              done
              echo "Postgres service is ready for user scheduler_user!"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        - name: wait-for-nats
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for nats (nats.messaging.svc.cluster.local:4222)..."; until nc -zv nats.messaging.svc.cluster.local 4222; do sleep 2; done; echo "NATS ready!"' ]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: scheduler
          image: registry.sfx-markt.de/scheduler:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9000
              name: grpc
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secrets
          env:
            - name: PG_CONN
              value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) dbname=scheduler user=scheduler_user search_path=scheduler,public sslmode=disable password=scheduler_pass"
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_PORT
            - name: PGDATABASE
              value: "scheduler"
            - name: PGUSER
              value: "scheduler_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: scheduler-secrets
                  key: SCHEDULER_PASS
            - name: PGSSLMODE
              value: "disable"
            - name: RPC_SERVICES
              value: "USERS=users.my-project.svc.cluster.local:9000"
            - name: OTEL_SERVICE_NAME
              value: "scheduler"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: my-project
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc-internal
      port: 9000
      targetPort: grpc
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-external # External service name
  namespace: my-project
  labels:
    app: scheduler
spec:
  selector:
    app: scheduler
  ports:
    - name: grpc-external
      protocol: TCP
      port: 30042 # External port
      targetPort: grpc
  type: LoadBalancer