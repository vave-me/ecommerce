apiVersion: v1
kind: Secret
metadata:
  name: geocoding-secrets
  namespace: my-project
type: Opaque
data:
  GEOCODING_API_KEY: REDACTED
  GEOCODING_TOKEN_SECRET: REDACTED
  NOMINATIM_PASSWORD: REDACTED
  GEOCODING_PASS: REDACTED
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geocoding
  namespace: my-project
  labels:
    app: geocoding
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geocoding
  template:
    metadata:
      labels:
        app: geocoding
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocoding-secrets
                  key: GEOCODING_PASS
          command: [ 'sh', '-c' ]
          args:
            - |
              set -e
              echo "Waiting for postgres service (postgres.database.svc.cluster.local:5432) to accept connections for user geocoding_user..."
              until psql -h postgres.database.svc.cluster.local -U geocoding_user -d geocoding -c "SELECT 1;" > /dev/null 2>&1; do
                echo "Postgres not ready yet for user geocoding_user, sleeping for 2 seconds..."
                sleep 2
              done
              echo "Postgres service is ready for user geocoding_user!"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        - name: wait-for-nats
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for nats (nats.messaging.svc.cluster.local:4222)..."; until nc -zv nats.messaging.svc.cluster.local 4222; do sleep 2; done; echo "NATS ready!"' ]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: geocoding
          image: registry.sfx-markt.de/geocoding:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9000
              name: grpc
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secrets
          env:
            - name: PG_CONN
              value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) dbname=geocoding user=geocoding_user search_path=geocoding,public sslmode=disable password=geocoding_pass"
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_PORT
            - name: PGDATABASE
              value: "geocoding"
            - name: PGUSER
              value: "geocoding_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: geocoding-secrets
                  key: GEOCODING_PASS
            - name: PGSSLMODE
              value: "disable"
            - name: RPC_SERVICES
              value: "GEOCODING=geocoding.my-project.svc.cluster.local:9000"
            - name: OTEL_SERVICE_NAME
              value: "geocoding"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            # Added variables sourced from the geocoding-secrets Secret
            - name: GEOCODING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: geocoding-secrets
                  key: GEOCODING_API_KEY
            - name: GEOCODING_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: geocoding-secrets
                  key: GEOCODING_TOKEN_SECRET
            - name: NOMINATIM_PASSWORD # Assuming this is needed by geocoding service
              valueFrom:
                secretKeyRef:
                  name: geocoding-secrets
                  key: NOMINATIM_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: geocoding
  namespace: my-project
  labels:
    app: geocoding
spec:
  selector:
    app: geocoding
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc-internal
      port: 9000
      targetPort: grpc
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: geocoding-external # External service name
  namespace: my-project
  labels:
    app: geocoding
spec:
  selector:
    app: geocoding
  ports:
    - name: grpc-external
      protocol: TCP
      port: 30007 # External port
      targetPort: grpc
  type: LoadBalancer