apiVersion: v1
kind: Secret
metadata:
  name: messages-secrets
  namespace: my-project
type: Opaque
data:
  MESSAGES_PASS: REDACTED
  NATS_WEBSOCKET: d3M6Ly9uYXRzLm1lc3NhZ2luZy5zdmMuY2x1c3Rlci5sb2NhbDo5MjIy
  MESSENGER_STREAM: bWVzc2VuZ2Vy
  MESSENGER_WEBSOCKET_SUBJECT: d3MubWVzc2VuZ2Vy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages
  namespace: my-project
  labels:
    app: messages
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messages
  template:
    metadata:
      labels:
        app: messages
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: messages-secrets
                  key: MESSAGES_PASS
          command: [ 'sh', '-c' ]
          args:
            - |
              set -e
              echo "Waiting for postgres service (postgres.database.svc.cluster.local:5432) to accept connections for user messages_user..."
              until psql -h postgres.database.svc.cluster.local -U messages_user -d messages -c "SELECT 1;" > /dev/null 2>&1; do
                echo "Postgres not ready yet for user messages_user, sleeping for 2 seconds..."
                sleep 2
              done
              echo "Postgres service is ready for user messages_user!"
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
        - name: wait-for-nats
          image: busybox:1.36
          command: [ 'sh', '-c', 'echo "Waiting for nats (nats.messaging.svc.cluster.local:4222)..."; until nc -zv nats.messaging.svc.cluster.local 4222; do sleep 2; done; echo "NATS ready!"' ]
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: messages
          image: registry.sfx-markt.de/messages:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9000
              name: grpc
          envFrom:
            - configMapRef:
                name: common-config
            - secretRef:
                name: common-secrets
          env:
            - name: PG_CONN
              value: "host=$(POSTGRES_HOST) port=$(POSTGRES_PORT) dbname=messages user=messages_user search_path=messages,public sslmode=disable password=messages_pass"
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_HOST
            - name: PGPORT
              valueFrom:
                configMapKeyRef:
                  name: common-config
                  key: POSTGRES_PORT
            - name: PGDATABASE
              value: "messages"
            - name: PGUSER
              value: "messages_user"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: messages-secrets
                  key: MESSAGES_PASS
            - name: PGSSLMODE
              value: "disable"
            - name: RPC_SERVICES # Adjusted - messages service might need to call others, or maybe just itself? Check app code.
              value: "MESSAGES=messages.my-project.svc.cluster.local:9000"
            - name: NATS_WEBSOCKET # Added
              valueFrom:
                secretKeyRef:
                  name: messages-secrets
                  key: NATS_WEBSOCKET
            - name: MESSENGER_STREAM # Added - Ensure app uses this env var name
              valueFrom:
                secretKeyRef:
                  name: messages-secrets
                  key: MESSENGER_STREAM
            - name: MESSENGER_WEBSOCKET_SUBJECT # Added - Ensure app uses this env var name
              valueFrom:
                secretKeyRef:
                  name: messages-secrets
                  key: MESSENGER_WEBSOCKET_SUBJECT
            - name: OTEL_SERVICE_NAME
              value: "messages"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4317"
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: messages
  namespace: my-project
  labels:
    app: messages
spec:
  selector:
    app: messages
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc-internal
      port: 9000
      targetPort: grpc
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: messages-external # External service name
  namespace: my-project
  labels:
    app: messages
spec:
  selector:
    app: messages
  ports:
    - name: grpc-external
      protocol: TCP
      port: 30011 # External port
      targetPort: grpc
  type: LoadBalancer