apiVersion: v1
kind: ConfigMap
metadata:
  name: db-scripts
  namespace: my-project
data:
  init_db.psql: |
    CREATE DATABASE commondb TEMPLATE template0;
    \c commondb
    CREATE OR REPLACE FUNCTION created_at_trigger() RETURNS TRIGGER AS $$
    BEGIN NEW.created_at := OLD.created_at; RETURN NEW; END;
    $$ LANGUAGE 'plpgsql';
    CREATE OR REPLACE FUNCTION updated_at_trigger() RETURNS TRIGGER AS $$
    BEGIN
      IF row(NEW.*) IS DISTINCT FROM row(OLD.*) THEN
        NEW.updated_at = NOW(); RETURN NEW;
      ELSE RETURN OLD; END IF;
    END;
    $$ LANGUAGE 'plpgsql';
    GRANT EXECUTE ON FUNCTION created_at_trigger() TO public;
    GRANT EXECUTE ON FUNCTION updated_at_trigger() TO public;

  init_service_db.psql: |
    CREATE DATABASE :"db" TEMPLATE commondb;
    CREATE USER :"user" WITH ENCRYPTED PASSWORD :'pass';
    GRANT CREATE, CONNECT ON DATABASE :"db" TO :"user";
    \c :"db"
    GRANT CONNECT ON DATABASE :"db" TO postgres;
    CREATE SCHEMA IF NOT EXISTS :"db";
    GRANT CREATE, USAGE ON SCHEMA :"db" TO :"user";
    \if :{?needs_postgis}
      \if :needs_postgis
        \echo 'Ensuring PostGIS extension exists in database ':"db"'...'
        CREATE EXTENSION IF NOT EXISTS postgis;
        GRANT SELECT, INSERT, UPDATE, DELETE ON geometry_columns TO :"user";
        GRANT SELECT, INSERT, UPDATE, DELETE ON spatial_ref_sys TO :"user";
        GRANT SELECT, INSERT, UPDATE, DELETE ON geography_columns TO :"user";
      \endif
    \endif
    GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA :"db" TO :"user";
    GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA :"db" TO :"user";
    GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA :"db" TO :"user";
    ALTER SCHEMA :"db" OWNER TO :"user";
---
apiVersion: v1
kind: Secret
metadata:
  name: service-db-passwords
  namespace: my-project
type: Opaque
data:
  ACTIVITY_PASS: REDACTED
  USERS_PASS: REDACTED
  PRODUCTS_PASS: REDACTED
  BASKETS_PASS: REDACTED
  CATEGORIES_PASS: REDACTED
  COMMENTS_PASS: REDACTED
  GEOCODING_PASS: REDACTED
  MAILER_PASS: REDACTED
  MEDIA_PASS: REDACTED
  MESSAGES_PASS: REDACTED
  NEWSLETTERS_PASS: REDACTED
  NOTIFICATIONS_PASS: REDACTED
  OFFERS_PASS: REDACTED
  ORDERING_PASS: REDACTED
  PAYMENTS_PASS: REDACTED
  SEARCH_PASS: REDACTED
  POSTS_PASS: REDACTED
  SHIPPING_PASS: REDACTED
  SUPPORT_PASS: REDACTED
  WISHLISTS_PASS: REDACTED
  REVIEWS_PASS: REDACTED
  FOLLOWING_PASS: REDACTED
  ASSISTANTS_PASS: REDACTED
  METRICS_PASS: REDACTED
  COSEC_PASS: REDACTED
  SERVICES_PASS: REDACTED
  ERP_PASS: REDACTED
  SCHEDULER_PASS: REDACTED
  MERCHANT_PASS: REDACTED
  MANAGERS_PASS: REDACTED
